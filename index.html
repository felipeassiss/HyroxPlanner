<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HyroxPlanner - Dashboard</title>
</head>
<body>
    <header id="cabecalho-principal">
        <h1>🏋️‍♂️ HyroxPlanner</h1>
        <p>Fundamentos da Programação — 2026</p>
    </header>

    <main id="dashboard-container" class="grid-opcoes">
        <a href="/treinos" class="cartao-opcao" id="card-treinos">
            <h2>📋 Treinos</h2>
            <p>Cadastre, liste e edite seus treinos diários.</p>
        </a>

        <a href="/competicoes" class="cartao-opcao" id="card-competicoes">
            <h2>🏆 Competições</h2>
            <p>Acompanhe o cronômetro para seus eventos.</p>
        </a>

        <a href="/assistente" class="cartao-opcao" id="card-ia">
            <h2>🤖 Assistente IA</h2>
            <p>Análise de histórico e dicas com a Groq API.</p>
        </a>
    </main>
</body>
</html>
